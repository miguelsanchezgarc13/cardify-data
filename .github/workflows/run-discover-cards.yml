name: Run Discover Extra Cards

on:
  workflow_dispatch: # Permite ejecutarlo manualmente con el botón en GitHub Actions
  # push:
  #   branches: [ main ] # Descomenta si quieres que se ejecute también al hacer push

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga/clona tu repositorio en el servidor virtual de GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura Python en el entorno
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Instala las dependencias necesarias (incluyendo requests)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Ejecuta el script que está en la raíz
      - name: Run discover_extra_cards.py
        run: python discover_extra_cards.py
