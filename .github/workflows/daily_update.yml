name: Actualizador Diario de Precios TCGplayer

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 AM UTC diariamente
  workflow_dispatch:

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar Script de Actualización
        run: python update_cards.py
        env:
          TCGPLAYER_CLIENT_ID: ${{ secrets.TCGPLAYER_CLIENT_ID }}
          TCGPLAYER_CLIENT_SECRET: ${{ secrets.TCGPLAYER_CLIENT_SECRET }}

      - name: Hacer Commit y Push del JSON
        run: |
          git config --global user.name "Cardify-Bot"
          git config --global user.email "bot@cardify.app"
          git add cards.json
          git commit -m "🤖 Actualización automática de mercado: TCGplayer" || echo "No hay cambios para subir"
          git push
