name: Actualizador Diario de Cartas Cardify

on:
  schedule:
    - cron: '0 3 * * *' # Se ejecuta todos los días a las 03:00 AM UTC
  workflow_dispatch: # Te permite ejecutarlo manualmente con un botón

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar Script de Actualización
        run: python update_cards.py
        env:
          # Aquí inyectas variables ocultas si usas APIs privadas
          OP_API_URL: ${{ secrets.OP_API_URL }} 

      - name: Hacer Commit y Push si hay cambios
        run: |
          git config --global user.name "Cardify-Bot"
          git config --global user.email "bot@cardify.app"
          git add cards.json
          git commit -m "🤖 Actualización diaria de precios y cartas" || echo "No hay cambios para subir"
          git push
